<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Root-Cause Analyst</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <div class="brand-row">
          <svg class="brand-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect width="24" height="24" rx="6" fill="var(--series-1)"/>
            <path d="M5 13.5l3-3.5 3 4 4-7.5 4 3.5" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h1>Automated Root-Cause Analyst</h1>
        </div>
        <div class="sub" id="meta-sub">Loading dataset info…</div>
      </div>
    </header>

    <div class="tiles" id="tiles"></div>

    <div class="filters-row">
      <div class="tabs" id="metric-tabs"></div>
      <input type="date" id="start-date" />
      <span style="color:var(--text-muted); font-size:13px;">to</span>
      <input type="date" id="end-date" />
      <div class="spacer"></div>
      <button class="btn primary" id="scan-btn">Scan for incidents</button>
    </div>

    <div class="chart-card">
      <div class="chart-title" id="chart-title">Revenue over time</div>
      <div class="chart-legend" id="chart-legend" style="display:none;"></div>
      <div style="position:relative;">
        <svg class="chart" id="chart"></svg>
        <div class="tooltip" id="tooltip"></div>
      </div>
    </div>

    <section>
      <h2>Incidents</h2>
      <p class="section-hint">Detected anomalies, most recent first — click one for the full root-cause breakdown.</p>
      <div class="incident-list" id="incident-list"><div class="loading">Loading…</div></div>
    </section>

    <section id="latency-section" style="display:none;">
      <h2>Investigation latency</h2>
      <p class="section-hint">Measured from every real run's own trace, not a synthetic benchmark — "seconds, not days."</p>
      <div class="latency-card" id="latency-card"></div>
    </section>
  </div>
  <div class="toast-container" id="toast-container"></div>
  <script src="app.js"></script>
</body>
</html>
