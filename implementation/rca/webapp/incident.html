<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Incident detail — Root-Cause Analyst</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <a class="back" href="index.html">&larr; Back to dashboard</a>
        <h1 id="title" style="margin-top:6px;">Loading…</h1>
        <div class="sub" id="sub"></div>
      </div>
      <button class="btn primary" id="followup-btn" style="display:none;">Follow up in chat &rarr;</button>
    </header>

    <div class="narrative-panel" id="narrative">Loading…</div>

    <div class="headline-card" id="headline"></div>

    <section>
      <h2>What moved</h2>
      <p class="section-hint">How the revenue identity (requests × fill rate × render rate × eCPM) broke down over this window.</p>
      <div class="factor-grid" id="factor-grid"></div>
    </section>

    <section>
      <h2>How we found it</h2>
      <p class="section-hint">Every segment checked, ranked by how much of the movement it explains — expand a level to see the full evidence.</p>
      <div id="drill-tree"></div>
    </section>
  </div>
  <script src="incident.js"></script>
</body>
</html>
