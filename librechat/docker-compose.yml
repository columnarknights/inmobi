# Trimmed LibreChat stack for this project: just the chat app + its database,
# plus the official ClickHouse MCP server as its own container so users can
# ask ad-hoc SQL questions, and our own rca MCP server (run on the host, see
# ../src/rca/mcp_server.py) for the validated investigate/scan pipeline.
# Meilisearch/RAG/admin-panel are intentionally omitted — not needed here.
services:
  librechat:
    container_name: librechat
    image: registry.librechat.ai/danny-avila/librechat-dev:latest
    ports:
      - "${PORT:-3080}:${PORT:-3080}"
    depends_on:
      - mongodb
      - clickhouse-mcp
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - SEARCH=false
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml

  mongodb:
    container_name: librechat-mongodb
    image: mongo:8.0.20
    restart: unless-stopped
    command: mongod --noauth
    volumes:
      - ./data-node:/data/db

  clickhouse-mcp:
    container_name: clickhouse-mcp
    image: mcp/clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_SECURE: ${CLICKHOUSE_SECURE:-true}
      CLICKHOUSE_VERIFY: "true"
      CLICKHOUSE_MCP_SERVER_TRANSPORT: http
      CLICKHOUSE_MCP_BIND_HOST: 0.0.0.0
      CLICKHOUSE_MCP_BIND_PORT: 8000
      CLICKHOUSE_MCP_AUTH_DISABLED: "true"
